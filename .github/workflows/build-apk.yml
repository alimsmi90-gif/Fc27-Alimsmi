name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev


      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108"


      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install \
            buildozer \
            cython==0.29.37 \
            sh==1.14.3


      - name: Check versions
        run: |
          python --version
          buildozer --version
          cython --version


      - name: Build debug APK
        run: |
          buildozer android clean
          buildozer -v android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fc27unofficial-apk
          path: bin/*.apk
