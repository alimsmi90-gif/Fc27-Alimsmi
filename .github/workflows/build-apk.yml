name: Build FC27 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython<3"

      - name: Extract camera files
        run: |
          mkdir -p assets/Camera_1
          mkdir -p assets/Camera_2
          mkdir -p assets/Camera_3
          mkdir -p assets/Camera_4
          mkdir -p assets/Camera_5

          unzip -o Camera_1.zip -d assets/Camera_1
          unzip -o Camera_2.zip -d assets/Camera_2
          unzip -o Camera_3.zip -d assets/Camera_3
          unzip -o Camera_4.zip -d assets/Camera_4
          unzip -o Camera_5.zip -d assets/Camera_5

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FC27-Android15-APK
          path: bin/*.apk
